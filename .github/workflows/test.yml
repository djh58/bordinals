name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest -v test_sequin.py test_dropstitch.py
